<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>farmclip — calibration clicker</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #ddd; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #1b1b1b; flex-wrap: wrap; }
  canvas { display: block; max-width: 100vw; cursor: crosshair; }
  button { background: #333; color: #ddd; border: 1px solid #555; padding: 4px 10px; cursor: pointer; }
  #cur { color: #ffd54f; font-weight: 600; }
  #saved { color: #8bc34a; }
</style>
</head>
<body>
<div id="bar">
  <button id="open">open project folder</button>
  <select id="run"></select>
  <span>click: <span id="cur">—</span></span>
  <button id="skip">skip (s)</button>
  <button id="undo">undo (u)</button>
  <select id="relabel"><option value="">relabel…</option></select>
  <button id="flipnf" title="swap near &lt;-&gt; far on every clicked point">flip near/far (f)</button>
  <button id="fliplr" title="swap left &lt;-&gt; right on every clicked point">flip L/R (g)</button>
  <button id="prev" style="display:none">◀ prev image (r)</button>
  <button id="next" style="display:none">next image (n)</button>
  <button id="bad" style="display:none">bad image (delete) (d)</button>
  <span id="saved"></span>
</div>
<canvas id="cv"></canvas>
<div style="padding:6px 12px;color:#aaa">
  Click each named point on the frame (zoom: browser zoom works fine).
  <b>skip</b> if it's out of frame / occluded. Auto-saves
  <code>&lt;outdir&gt;/annotations.json</code> after every click.
  Aim for 8+ points including net tops / antenna tips — off-floor points
  matter most.
</div>

<script>
// fallback if data/runs.json missing (stage_clip.py writes it)
let RUNS = [
  { name: "menlo",  dir: "data/runs/menlo",  frame: "ref_frame.jpg" },
  { name: "mikasa", dir: "data/runs/mikasa", frame: "ref_frame.jpg" },
];
const POINTS = [
  "corner_far_left", "corner_far_right", "corner_near_left", "corner_near_right",
  "attack_far_left", "attack_far_right", "attack_near_left", "attack_near_right",
  "center_left", "center_right",
  "net_top_left", "net_top_right",
  "antenna_tip_left", "antenna_tip_right",
  // ponytail: post_* dropped — post geometry varies per venue, labels were noise
];
const HINTS = {
  net_top_left: "= BOTTOM of the left antenna (net top band at sideline)",
  net_top_right: "= BOTTOM of the right antenna",
  antenna_tip_left: "very top of the left antenna rod",
  antenna_tip_right: "very top of the right antenna rod",
};
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let dir = null, runCfg = null, img = new Image(), ann = {}, order = [], oi = 0;
let webMode = false, webQueue = [], webIdx = 0, webQueues = {};

async function getHandle(root, path, opts) {
  const parts = path.split("/");
  let d = root;
  for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p, opts);
  return d.getFileHandle(parts.at(-1), opts);
}

$("open").onclick = async () => {
  dir = await showDirectoryPicker({ mode: "readwrite" });
  try {
    const f = await (await getHandle(dir, "data/runs.json")).getFile();
    RUNS = JSON.parse(await f.text()).map(r => ({ name: r.name, dir: r.labels || r.dir, frame: r.ref }));
  } catch {} // no runs.json — keep hardcoded fallback
  $("run").innerHTML = RUNS.map((r, i) => `<option value="${i}">${r.name}</option>`).join("");
  for (const folder of ["pool", "test"]) {
    try {
      const wd = await (await dir.getDirectoryHandle("data")).getDirectoryHandle(folder);
      const labeled = new Set();
      try {
        for await (const n of (await wd.getDirectoryHandle("labels")).keys())
          labeled.add(n.replace(/\.json$/, ""));
      } catch {}
      const q = [];
      let nImg = 0;
      for await (const [n, h] of wd.entries())
        if (h.kind === "file" && /\.(jpe?g|png)$/i.test(n)) {
          nImg++;
          if (!labeled.has(stem(n))) q.push(n);
        }
      q.sort();
      if (nImg) {
        webQueues[folder] = q;
        const opt = document.createElement("option");
        opt.value = folder;
        opt.textContent = folder === "pool"
          ? `web images (${q.length} unlabeled)`
          : `TEST set - held out (${q.length} unlabeled)`;
        $("run").appendChild(opt);
      }
    } catch {} // folder absent
  }
  $("saved").textContent = `${RUNS.length} runs`;
  loadRun(0);
};
$("run").onchange = e => {
  if (webQueues[e.target.value]) {
    webFolder = e.target.value;
    webQueue = webQueues[webFolder];
    loadWeb(0);
  } else loadRun(+e.target.value);
};

const stem = n => n.replace(/\.[^.]+$/, "");
// Which pool image-batch mode is reading. data/pool is the TRAINING pool;
// data/test is a held-out benchmark that must never be trained on, so it is
// a separate folder rather than a flag on the same one.
let webFolder = "pool";
const webDir = async () =>
  (await dir.getDirectoryHandle("data")).getDirectoryHandle(webFolder);

async function loadWeb(k) {
  webMode = true; webIdx = k;
  clearInterval(pollTimer); pollStem = null;
  $("next").style.display = $("bad").style.display = $("prev").style.display = "";
  ann = {}; order = POINTS.slice(); oi = 0;
  if (k >= webQueue.length) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    $("cur").textContent = "DONE — no more web images";
    $("saved").textContent = `${webQueue.length} / ${webQueue.length} unlabeled`;
    return;
  }
  let file;
  try {
    file = await (await getHandle(dir, `data/${webFolder}/${webQueue[k]}`)).getFile();
  } catch { // file vanished (renumbered/deleted outside) — drop and continue
    webQueue.splice(k, 1);
    return loadWeb(k);
  }
  // Reload labels already on disk. Without this, stepping BACK to an image
  // would start from an empty ann, and the next click would save() just that
  // one point over the top of everything previously clicked.
  try {
    const lf = await (await getHandle(
      dir, `data/${webFolder}/labels/${stem(webQueue[k])}.json`)).getFile();
    ann = JSON.parse(await lf.text());
    oi = order.findIndex(p => !(p in ann));
    if (oi < 0) oi = order.length;
  } catch {} // never labelled yet
  img.src = URL.createObjectURL(file);
  img.onload = draw;
  $("saved").textContent = `${k + 1} / ${webQueue.length} unlabeled`
    + (Object.keys(ann).length ? ` · ${Object.keys(ann).length} pts loaded` : "");
}

// Manual orientation flips. A court is symmetric front-to-back and
// left-to-right, so when only one end or one side is visible the solver cannot
// tell which way round it goes -- both assignments fit the clicks equally well
// and no error number complains. These rename the points in place (positions
// are untouched), which is the one thing a human can see and the solver cannot.
function relabelPoints(mapFn) {
  const out = {};
  for (const [k, v] of Object.entries(ann)) out[mapFn(k)] = v;
  ann = out;
  oi = order.findIndex(p => !(p in ann));
  if (oi < 0) oi = order.length;
  save(); draw();
}
$("flipnf").onclick = () => relabelPoints(k =>
  k.includes("_near_") ? k.replace("_near_", "_far_")
  : k.includes("_far_") ? k.replace("_far_", "_near_") : k);
$("fliplr").onclick = () => relabelPoints(k =>
  k.endsWith("_left") ? k.slice(0, -5) + "_right"
  : k.endsWith("_right") ? k.slice(0, -6) + "_left" : k);

$("next").onclick = () => { if (webMode) loadWeb(webIdx + 1); };
$("prev").onclick = () => { if (webMode && webIdx > 0) loadWeb(webIdx - 1); };
$("bad").onclick = async () => {
  if (!webMode || webIdx >= webQueue.length) return;
  const name = webQueue[webIdx];
  const wd = await webDir();
  await wd.removeEntry(name);
  try { await (await wd.getDirectoryHandle("labels")).removeEntry(stem(name) + ".json"); } catch {}
  const fh = await wd.getFileHandle("deleted.txt", { create: true });
  const old = await (await fh.getFile()).text();
  const w = await fh.createWritable();
  await w.write(old + name + "\n"); await w.close();
  webQueue.splice(webIdx, 1);
  loadWeb(webIdx);
};
document.addEventListener("keydown", e => {
  if (/SELECT|INPUT/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  // s/u are point-level, so they work in run mode too; n/r/d are image nav
  if (e.key === "s") { $("skip").onclick(); return; }
  if (e.key === "u") { $("undo").onclick(); return; }
  if (e.key === "f") { $("flipnf").onclick(); return; }
  if (e.key === "g") { $("fliplr").onclick(); return; }
  if (!webMode) return;
  if (e.key === "n") $("next").onclick();
  if (e.key === "r") $("prev").onclick();
  if (e.key === "d") $("bad").onclick();
});

async function loadRun(i) {
  webMode = false;
  clearInterval(pollTimer); pollStem = null;
  $("next").style.display = $("bad").style.display = "none";
  runCfg = RUNS[i];
  ann = {};
  try {
    const f = await (await getHandle(dir, `${runCfg.dir}/annotations.json`)).getFile();
    ann = JSON.parse(await f.text());
  } catch {}
  order = POINTS.filter(p => !(p in ann));
  oi = 0;
  const fh = await getHandle(dir, `${runCfg.dir}/${runCfg.frame}`);
  img.src = URL.createObjectURL(await fh.getFile());
  img.onload = draw;
}

function draw() {
  cv.width = img.width; cv.height = img.height;
  ctx.drawImage(img, 0, 0);
  for (const [k, [x, y]] of Object.entries(ann)) {
    if (x === null) continue;
    ctx.strokeStyle = "#4caf50"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y);
    ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10);
    ctx.stroke();
    ctx.fillStyle = "#4caf50"; ctx.font = "12px monospace";
    ctx.fillText(k, x + 6, y - 6);
  }
  $("cur").textContent = oi < order.length ?
    order[oi] + (HINTS[order[oi]] ? "  (" + HINTS[order[oi]] + ")" : "") :
    "DONE — all points handled";
}

let pollTimer = null, pollStem = null;
function pollOverlay(s, since) {
  clearInterval(pollTimer);
  pollStem = s;
  let tries = 0;
  pollTimer = setInterval(async () => {
    if (pollStem !== s || ++tries > 20) return clearInterval(pollTimer);
    try {
      // runs keep their overlay beside the annotation; image pools use overlays/
      const path = webMode ? `data/${webFolder}/overlays/${s}.jpg`
                           : `${runCfg.dir}/overlay.jpg`;
      const f = await (await getHandle(dir, path)).getFile();
      if (f.lastModified >= since) {
        clearInterval(pollTimer);
        img.src = URL.createObjectURL(f);
        img.onload = draw;
        $("saved").textContent = "overlay ✓ (err stamped top-left)";
      }
    } catch {} // watcher hasn't rendered yet
  }, 1000);
}

async function save() {
  const out = {};
  for (const [k, v] of Object.entries(ann)) if (v && v[0] !== null) out[k] = v;
  const path = webMode
    ? `data/${webFolder}/labels/${stem(webQueue[webIdx])}.json`
    : `${runCfg.dir}/annotations.json`;
  const fh = await getHandle(dir, path, { create: true });
  const w = await fh.createWritable();
  await w.write(JSON.stringify(out, null, 1)); await w.close();
  $("saved").textContent = "saved ✓";
  setTimeout(() => {
    $("saved").textContent = webMode ? `${webIdx + 1} / ${webQueue.length} unlabeled` : "";
  }, 1000);
  // runs need this as much as image pools do — labelling a run blind is how
  // a single bad click ends up applied to 40 training frames instead of 1
  if (Object.keys(out).length >= 5)
    pollOverlay(webMode ? stem(webQueue[webIdx]) : runCfg.name,
                Date.now() - 3000);
}

cv.addEventListener("click", e => {
  if (oi >= order.length || (webMode && webIdx >= webQueue.length)) return;
  const r = cv.getBoundingClientRect();
  ann[order[oi]] = [
    Math.round((e.clientX - r.left) * cv.width / r.width * 10) / 10,
    Math.round((e.clientY - r.top) * cv.height / r.height * 10) / 10];
  oi++; save(); draw();
});
$("skip").onclick = () => {
  if (oi >= order.length) return;
  ann[order[oi]] = [null, null];
  oi++; save(); draw();
};
$("undo").onclick = () => {
  if (oi > 0) { oi--; delete ann[order[oi]]; save(); draw(); }
};
$("relabel").innerHTML += POINTS.map(p => `<option>${p}</option>`).join("");
$("relabel").onchange = e => {
  const p = e.target.value;
  if (!p) return;
  delete ann[p];
  order = order.slice(0, oi).concat([p], order.slice(oi));
  e.target.value = "";
  save(); draw();
};
</script>
</body>
</html>
