<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>farmclip — calibration clicker</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #ddd; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #1b1b1b; flex-wrap: wrap; }
  canvas { display: block; max-width: 100vw; cursor: crosshair; }
  button { background: #333; color: #ddd; border: 1px solid #555; padding: 4px 10px; cursor: pointer; }
  #cur { color: #ffd54f; font-weight: 600; }
  #saved { color: #8bc34a; }
</style>
</head>
<body>
<div id="bar">
  <button id="open">open project folder</button>
  <select id="run"></select>
  <span>click: <span id="cur">—</span></span>
  <button id="skip">skip (not visible)</button>
  <button id="undo">undo</button>
  <select id="relabel"><option value="">relabel…</option></select>
  <button id="next" style="display:none">next image (n)</button>
  <button id="bad" style="display:none">bad image (delete) (d)</button>
  <span id="saved"></span>
</div>
<canvas id="cv"></canvas>
<div style="padding:6px 12px;color:#aaa">
  Click each named point on the frame (zoom: browser zoom works fine).
  <b>skip</b> if it's out of frame / occluded. Auto-saves
  <code>&lt;outdir&gt;/annotations.json</code> after every click.
  Aim for 8+ points including net tops / antenna tips — off-floor points
  matter most.
</div>

<script>
// fallback if out/runs.json missing (stage_clip.py writes it)
let RUNS = [
  { name: "menlo",  dir: "out",        frame: "debug/ref_frame.jpg" },
  { name: "mikasa", dir: "out/mikasa", frame: "debug/ref_frame.jpg" },
];
const POINTS = [
  "corner_far_left", "corner_far_right", "corner_near_left", "corner_near_right",
  "attack_far_left", "attack_far_right", "attack_near_left", "attack_near_right",
  "center_left", "center_right",
  "net_top_left", "net_top_right",
  "antenna_tip_left", "antenna_tip_right",
  "post_top_left", "post_top_right", "post_base_left", "post_base_right",
];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let dir = null, runCfg = null, img = new Image(), ann = {}, order = [], oi = 0;
let webMode = false, webQueue = [], webIdx = 0;

async function getHandle(root, path, opts) {
  const parts = path.split("/");
  let d = root;
  for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p, opts);
  return d.getFileHandle(parts.at(-1), opts);
}

$("open").onclick = async () => {
  dir = await showDirectoryPicker({ mode: "readwrite" });
  try {
    const f = await (await getHandle(dir, "out/runs.json")).getFile();
    RUNS = JSON.parse(await f.text()).map(r => ({ name: r.name, dir: r.dir, frame: r.ref }));
  } catch {} // no runs.json — keep hardcoded fallback
  $("run").innerHTML = RUNS.map((r, i) => `<option value="${i}">${r.name}</option>`).join("");
  try {  // out/webimgs/ present => offer image-batch mode
    const wd = await webDir();
    const labeled = new Set();
    try {
      for await (const n of (await wd.getDirectoryHandle("labels")).keys())
        labeled.add(n.replace(/\.json$/, ""));
    } catch {}
    webQueue = [];
    let nImg = 0;
    for await (const [n, h] of wd.entries())
      if (h.kind === "file" && /\.(jpe?g|png)$/i.test(n)) {
        nImg++;
        if (!labeled.has(stem(n))) webQueue.push(n);
      }
    webQueue.sort();
    if (nImg) {
      const opt = document.createElement("option");
      opt.value = "web"; opt.textContent = `web images (${webQueue.length} unlabeled)`;
      $("run").appendChild(opt);
    }
  } catch {} // no out/webimgs — video runs only
  $("saved").textContent = `${RUNS.length} runs`;
  loadRun(0);
};
$("run").onchange = e => e.target.value === "web" ? loadWeb(0) : loadRun(+e.target.value);

const stem = n => n.replace(/\.[^.]+$/, "");
const webDir = async () =>
  (await dir.getDirectoryHandle("out")).getDirectoryHandle("webimgs");

async function loadWeb(k) {
  webMode = true; webIdx = k;
  clearInterval(pollTimer); pollStem = null;
  $("next").style.display = $("bad").style.display = "";
  ann = {}; order = POINTS.slice(); oi = 0;
  if (k >= webQueue.length) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    $("cur").textContent = "DONE — no more web images";
    $("saved").textContent = `${webQueue.length} / ${webQueue.length} unlabeled`;
    return;
  }
  let file;
  try {
    file = await (await getHandle(dir, `out/webimgs/${webQueue[k]}`)).getFile();
  } catch { // file vanished (renumbered/deleted outside) — drop and continue
    webQueue.splice(k, 1);
    return loadWeb(k);
  }
  img.src = URL.createObjectURL(file);
  img.onload = draw;
  $("saved").textContent = `${k + 1} / ${webQueue.length} unlabeled`;
}

$("next").onclick = () => { if (webMode) loadWeb(webIdx + 1); };
$("bad").onclick = async () => {
  if (!webMode || webIdx >= webQueue.length) return;
  const name = webQueue[webIdx];
  const wd = await webDir();
  await wd.removeEntry(name);
  try { await (await wd.getDirectoryHandle("labels")).removeEntry(stem(name) + ".json"); } catch {}
  const fh = await wd.getFileHandle("deleted.txt", { create: true });
  const old = await (await fh.getFile()).text();
  const w = await fh.createWritable();
  await w.write(old + name + "\n"); await w.close();
  webQueue.splice(webIdx, 1);
  loadWeb(webIdx);
};
document.addEventListener("keydown", e => {
  if (!webMode || /SELECT|INPUT/.test(e.target.tagName)) return;
  if (e.key === "n") $("next").onclick();
  if (e.key === "d") $("bad").onclick();
});

async function loadRun(i) {
  webMode = false;
  clearInterval(pollTimer); pollStem = null;
  $("next").style.display = $("bad").style.display = "none";
  runCfg = RUNS[i];
  ann = {};
  try {
    const f = await (await getHandle(dir, `${runCfg.dir}/annotations.json`)).getFile();
    ann = JSON.parse(await f.text());
  } catch {}
  order = POINTS.filter(p => !(p in ann));
  oi = 0;
  const fh = await getHandle(dir, `${runCfg.dir}/${runCfg.frame}`);
  img.src = URL.createObjectURL(await fh.getFile());
  img.onload = draw;
}

function draw() {
  cv.width = img.width; cv.height = img.height;
  ctx.drawImage(img, 0, 0);
  for (const [k, [x, y]] of Object.entries(ann)) {
    if (x === null) continue;
    ctx.strokeStyle = "#4caf50"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y);
    ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10);
    ctx.stroke();
    ctx.fillStyle = "#4caf50"; ctx.font = "12px monospace";
    ctx.fillText(k, x + 6, y - 6);
  }
  $("cur").textContent = oi < order.length ? order[oi] :
    "DONE — all points handled";
}

let pollTimer = null, pollStem = null;
function pollOverlay(s, since) {
  clearInterval(pollTimer);
  pollStem = s;
  let tries = 0;
  pollTimer = setInterval(async () => {
    if (!webMode || pollStem !== s || ++tries > 20) return clearInterval(pollTimer);
    try {
      const f = await (await getHandle(dir, `out/webimgs/overlays/${s}.jpg`)).getFile();
      if (f.lastModified >= since) {
        clearInterval(pollTimer);
        img.src = URL.createObjectURL(f);
        img.onload = draw;
        $("saved").textContent = "overlay ✓ (err stamped top-left)";
      }
    } catch {} // watcher hasn't rendered yet
  }, 1000);
}

async function save() {
  const out = {};
  for (const [k, v] of Object.entries(ann)) if (v && v[0] !== null) out[k] = v;
  const path = webMode
    ? `out/webimgs/labels/${stem(webQueue[webIdx])}.json`
    : `${runCfg.dir}/annotations.json`;
  const fh = await getHandle(dir, path, { create: true });
  const w = await fh.createWritable();
  await w.write(JSON.stringify(out, null, 1)); await w.close();
  $("saved").textContent = "saved ✓";
  setTimeout(() => {
    $("saved").textContent = webMode ? `${webIdx + 1} / ${webQueue.length} unlabeled` : "";
  }, 1000);
  if (webMode && Object.keys(out).length >= 5)
    pollOverlay(stem(webQueue[webIdx]), Date.now() - 3000);
}

cv.addEventListener("click", e => {
  if (oi >= order.length || (webMode && webIdx >= webQueue.length)) return;
  const r = cv.getBoundingClientRect();
  ann[order[oi]] = [
    Math.round((e.clientX - r.left) * cv.width / r.width * 10) / 10,
    Math.round((e.clientY - r.top) * cv.height / r.height * 10) / 10];
  oi++; save(); draw();
});
$("skip").onclick = () => {
  if (oi >= order.length) return;
  ann[order[oi]] = [null, null];
  oi++; save(); draw();
};
$("undo").onclick = () => {
  if (oi > 0) { oi--; delete ann[order[oi]]; save(); draw(); }
};
$("relabel").innerHTML += POINTS.map(p => `<option>${p}</option>`).join("");
$("relabel").onchange = e => {
  const p = e.target.value;
  if (!p) return;
  delete ann[p];
  order = order.slice(0, oi).concat([p], order.slice(oi));
  e.target.value = "";
  save(); draw();
};
</script>
</body>
</html>
