[project]
name = "farmclip"
version = "0.1.0"
description = "Volleyball video -> per-frame 3D scene JSON (court, ball, players)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "onnxruntime>=1.28.0",
    "opencv-python",
    "pandas>=3.0.5",
    "scipy>=1.17.1",
    "tqdm>=4.69.1",
    "ultralytics>=8.4.106",
]

[project.scripts]
farmclip = "farmclip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farmclip"]
