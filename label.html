<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>farmclip — ball label checker</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #ddd; }
  #bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 12px; background: #1b1b1b; }
  #bar label { display: flex; gap: 4px; align-items: center; }
  input[type=number] { width: 4em; }
  #stage { position: relative; }
  canvas { display: block; max-width: 100vw; cursor: crosshair; }
  #info { padding: 6px 12px; color: #aaa; }
  .k { color: #ffd54f; }
  button { background: #333; color: #ddd; border: 1px solid #555; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<div id="bar">
  <label>video <input type="file" id="vidFile" accept="video/*"></label>
  <label>labels csv <input type="file" id="csvFile" accept=".csv"></label>
  <label>ball0 csv <input type="file" id="b0File" accept=".csv" title="optional, enables class filter"></label>
  <label>ball1 csv <input type="file" id="b1File" accept=".csv" title="optional, enables class filter"></label>
  <label>fps <input type="number" id="fps" value="30"></label>
  <label>show
    <select id="filter">
      <option value="labeled">labeled frames</option>
      <option value="suspect">non-consensus only</option>
      <option value="all">every frame</option>
    </select>
  </label>
  <button id="save">download corrected csv</button>
  <span id="progress"></span>
</div>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="info">
  keys: <span class="k">space/enter</span> accept &amp; next ·
  <span class="k">x</span> no ball &amp; next ·
  <span class="k">click</span> correct position ·
  <span class="k">&larr;/&rarr;</span> prev/next ·
  <span class="k">g</span> go to frame
</div>
<video id="vid" style="display:none" muted></video>

<script>
const $ = id => document.getElementById(id);
const vid = $("vid"), cv = $("cv"), ctx = cv.getContext("2d");
let rows = [];      // {frame, vis, x, y, cls, status: ''|'ok'|'edit'|'reject'}
let queue = [];     // indices into rows for the active filter
let qi = 0;
let b0 = null, b1 = null;

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const head = lines[0].split(",");
  const iF = head.indexOf("Frame"), iV = head.indexOf("Visibility"),
        iX = head.indexOf("X"), iY = head.indexOf("Y");
  return lines.slice(1).map(l => {
    const c = l.split(",");
    return { frame: +c[iF], vis: +c[iV], x: +c[iX], y: +c[iY], status: "" };
  });
}

function byFrame(list) {
  const m = new Map();
  for (const r of list) m.set(r.frame, r);
  return m;
}

function classify() {
  if (!b0 || !b1) return;
  for (const r of rows) {
    const a = b0.get(r.frame), b = b1.get(r.frame);
    if (!r.vis) { r.cls = ""; continue; }
    if (a && b && a.vis && b.vis && Math.hypot(a.x - b.x, a.y - b.y) <= 12) r.cls = "consensus";
    else if ((a && a.vis) || (b && b.vis)) r.cls = "fit-backed";
    else r.cls = "gap-interp";
  }
}

function rebuild() {
  const f = $("filter").value;
  queue = rows.map((_, i) => i).filter(i =>
    f === "all" ? true :
    f === "suspect" ? rows[i].vis && rows[i].cls !== "consensus" :
    rows[i].vis > 0);
  qi = 0;
  show();
}

function show() {
  if (!queue.length || !vid.src) return;
  const r = rows[queue[qi]];
  vid.currentTime = (r.frame + 0.5) / (+$("fps").value || 30);
}

vid.addEventListener("seeked", draw);

function draw() {
  const r = rows[queue[qi]];
  if (!r) return;
  cv.width = vid.videoWidth; cv.height = vid.videoHeight;
  ctx.drawImage(vid, 0, 0);
  if (r.vis || r.status === "edit") {
    const col = r.status === "edit" ? "#4caf50" : r.status === "ok" ? "#8bc34a" : "#ffd54f";
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(r.x - 18, r.y); ctx.lineTo(r.x + 18, r.y);
    ctx.moveTo(r.x, r.y - 18); ctx.lineTo(r.x, r.y + 18);
    ctx.stroke();
    ctx.strokeRect(r.x - 9, r.y - 9, 18, 18);
  }
  ctx.fillStyle = "#000a"; ctx.fillRect(0, 0, 430, 28);
  ctx.fillStyle = "#fff"; ctx.font = "16px monospace";
  const st = r.status === "reject" ? "NO BALL" : r.status || "unchecked";
  ctx.fillText(`f${r.frame}  ${r.cls || (r.vis ? "" : "unlabeled")}  [${st}]`, 8, 20);
  const done = rows.filter(r => r.status).length;
  $("progress").textContent =
    `${qi + 1}/${queue.length} in view · ${done} checked · ` +
    `${rows.filter(r => r.status === "edit").length} corrected · ` +
    `${rows.filter(r => r.status === "reject").length} rejected`;
}

function step(d) { qi = Math.min(Math.max(qi + d, 0), queue.length - 1); show(); }

cv.addEventListener("click", e => {
  const r = rows[queue[qi]]; if (!r) return;
  const rect = cv.getBoundingClientRect();
  r.x = Math.round((e.clientX - rect.left) * cv.width / rect.width);
  r.y = Math.round((e.clientY - rect.top) * cv.height / rect.height);
  r.vis = 1; r.status = "edit";
  draw();
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const r = rows[queue[qi]]; if (!r) return;
  if (e.key === " " || e.key === "Enter") { if (!r.status) r.status = "ok"; step(1); e.preventDefault(); }
  else if (e.key === "x") { r.vis = 0; r.x = 0; r.y = 0; r.status = "reject"; step(1); }
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "g") {
    const f = +prompt("go to frame:");
    const j = queue.findIndex(i => rows[i].frame >= f);
    if (j >= 0) { qi = j; show(); }
  }
});

$("vidFile").onchange = e => { vid.src = URL.createObjectURL(e.target.files[0]); vid.onloadeddata = show; };
$("csvFile").onchange = async e => { rows = parseCsv(await e.target.files[0].text()); classify(); rebuild(); };
$("b0File").onchange = async e => { b0 = byFrame(parseCsv(await e.target.files[0].text())); classify(); rebuild(); };
$("b1File").onchange = async e => { b1 = byFrame(parseCsv(await e.target.files[0].text())); classify(); rebuild(); };
$("filter").onchange = rebuild;

$("save").onclick = () => {
  const csv = "Frame,Visibility,X,Y\n" +
    rows.map(r => `${r.frame},${r.vis},${r.x},${r.y}`).join("\n");
  const aEl = document.createElement("a");
  aEl.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  aEl.download = "labels_corrected.csv";
  aEl.click();
};
</script>
</body>
</html>
