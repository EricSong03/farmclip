<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>farmclip — ball label checker</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #ddd; }
  #bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 12px; background: #1b1b1b; }
  canvas { display: block; max-width: 100vw; cursor: crosshair; }
  #info { padding: 6px 12px; color: #aaa; }
  .k { color: #ffd54f; }
  button { background: #333; color: #ddd; border: 1px solid #555; padding: 4px 10px; cursor: pointer; }
  #saved { color: #8bc34a; }
</style>
</head>
<body>
<div id="bar">
  <button id="open">open project folder</button>
  <label>show
    <select id="filter">
      <option value="suspect">non-consensus only</option>
      <option value="labeled">all labeled frames</option>
      <option value="all">every frame</option>
    </select>
  </label>
  <span id="progress"></span>
  <span id="saved"></span>
</div>
<canvas id="cv"></canvas>
<div id="info">
  keys: <span class="k">space/enter</span> accept &amp; next ·
  <span class="k">x</span> no ball &amp; next ·
  <span class="k">click</span> correct position ·
  <span class="k">&larr;/&rarr;</span> back / forward ·
  corrections auto-save to <code>out/finetune/ball/&lt;name&gt;.labeled.csv</code>
</div>
<video id="vid" style="display:none" muted></video>

<script>
// ponytail: runs hardcoded — add a line here per new clip. fps is the frame
// rate the label csv was indexed at (mikasa csvs are 60fps-native).
const RUNS = [
  { name: "menlo",  video: "out/clip.mp4",        fps: 30, balls: "out" },
  { name: "mikasa", video: "out/mikasa/clip.mp4", fps: 60, balls: "out/mikasa" },
];

const $ = id => document.getElementById(id);
const vid = $("vid"), cv = $("cv"), ctx = cv.getContext("2d");
let dir = null;         // FileSystemDirectoryHandle
let runs = [];          // {cfg, rows, queue, qp, checked, videoUrl, dirty}
let history = [];       // {run, idx}
let hi = -1;
let current = null;     // runs[] entry whose video is loaded

async function getHandle(root, path, opts) {
  const parts = path.split("/");
  let d = root;
  for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p, opts);
  return d.getFileHandle(parts.at(-1), opts);
}
async function readCsv(path) {
  try {
    const f = await (await getHandle(dir, path)).getFile();
    return parseCsv(await f.text());
  } catch { return null; }
}
async function firstSubdirCsv(base) {  // <base>/*/ball.csv
  try {
    let d = dir;
    for (const p of base.split("/")) d = await d.getDirectoryHandle(p);
    for await (const e of d.values())
      if (e.kind === "directory")
        return parseCsv(await (await e.getFileHandle("ball.csv")).getFile().then(f => f.text()));
  } catch {}
  return null;
}

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const head = lines[0].split(",");
  const col = n => head.indexOf(n);
  const [iF, iV, iX, iY, iC] = ["Frame", "Visibility", "X", "Y", "Checked"].map(col);
  return lines.slice(1).map(l => {
    const c = l.split(",");
    return { frame: +c[iF], vis: +c[iV], x: +c[iX], y: +c[iY],
             status: iC >= 0 ? (c[iC] || "") : "" };
  });
}

function classify(rows, b0, b1) {
  const m0 = new Map(b0 ? b0.map(r => [r.frame, r]) : []);
  const m1 = new Map(b1 ? b1.map(r => [r.frame, r]) : []);
  for (const r of rows) {
    if (!r.vis) { r.cls = ""; continue; }
    const a = m0.get(r.frame), b = m1.get(r.frame);
    if (a && b && a.vis && b.vis && Math.hypot(a.x - b.x, a.y - b.y) <= 12) r.cls = "consensus";
    else if ((a && a.vis) || (b && b.vis)) r.cls = "fit-backed";
    else r.cls = b0 ? "gap-interp" : "";
  }
}

$("open").onclick = async () => {
  if (!window.showDirectoryPicker) { alert("Needs Chrome/Edge (File System Access API)."); return; }
  dir = await showDirectoryPicker({ mode: "readwrite" });
  runs = [];
  for (const cfg of RUNS) {
    const rows = await readCsv(`out/finetune/ball/${cfg.name}.labeled.csv`)
              || await readCsv(`out/finetune/ball/${cfg.name}.csv`);
    if (!rows) continue;
    classify(rows, await firstSubdirCsv(`${cfg.balls}/ball0`),
                   await firstSubdirCsv(`${cfg.balls}/ball1`));
    let videoUrl = null;
    try {
      videoUrl = URL.createObjectURL(await (await getHandle(dir, cfg.video)).getFile());
    } catch { continue; }
    runs.push({ cfg, rows, videoUrl, queue: [], qp: 0,
                checked: rows.filter(r => r.status).length, dirty: false });
  }
  if (!runs.length) { alert("No runs found — pick the farmclip repo root."); return; }
  rebuild();
};

function rebuild() {
  const f = $("filter").value;
  for (const r of runs) {
    r.queue = r.rows.map((_, i) => i).filter(i =>
      f === "all" ? true :
      f === "suspect" ? r.rows[i].vis && r.rows[i].cls !== "consensus" && !r.rows[i].status :
      r.rows[i].vis > 0);
    for (let i = r.queue.length - 1; i > 0; i--) {   // shuffle
      const j = Math.floor(Math.random() * (i + 1));
      [r.queue[i], r.queue[j]] = [r.queue[j], r.queue[i]];
    }
    r.qp = 0;
  }
  history = []; hi = -1;
  next();
}

function next() {
  if (hi < history.length - 1) { hi++; show(); return; }
  // balance: run with fewest checked labels that still has queue left
  const avail = runs.filter(r => r.qp < r.queue.length);
  if (!avail.length) { $("progress").textContent = "queue empty — switch filter or done!"; return; }
  const run = avail.reduce((a, b) => a.checked <= b.checked ? a : b);
  history.push({ run, idx: run.queue[run.qp++] });
  hi++;
  show();
}

function show() {
  const { run, idx } = history[hi];
  const go = () => { vid.currentTime = (run.rows[idx].frame + 0.5) / run.cfg.fps; };
  if (current !== run) {
    current = run;
    vid.src = run.videoUrl;
    vid.onloadeddata = go;
  } else go();
}

vid.addEventListener("seeked", draw);

function draw() {
  if (hi < 0) return;
  const { run, idx } = history[hi];
  const r = run.rows[idx];
  cv.width = vid.videoWidth; cv.height = vid.videoHeight;
  ctx.drawImage(vid, 0, 0);
  if (r.vis) {
    const col = r.status === "edit" ? "#4caf50" : r.status === "ok" ? "#8bc34a" : "#ffd54f";
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(r.x - 18, r.y); ctx.lineTo(r.x + 18, r.y);
    ctx.moveTo(r.x, r.y - 18); ctx.lineTo(r.x, r.y + 18);
    ctx.stroke();
    ctx.strokeRect(r.x - 9, r.y - 9, 18, 18);
  }
  ctx.fillStyle = "#000a"; ctx.fillRect(0, 0, 460, 28);
  ctx.fillStyle = "#fff"; ctx.font = "16px monospace";
  const st = r.status === "reject" ? "NO BALL" : r.status || "unchecked";
  ctx.fillText(`${run.cfg.name} f${r.frame}  ${r.cls || (r.vis ? "" : "unlabeled")}  [${st}]`, 8, 20);
  $("progress").textContent = runs.map(r =>
    `${r.cfg.name}: ${r.checked} checked / ${r.queue.length} queued`).join(" · ");
}

const saveTimers = {};
function autosave(run) {
  run.dirty = true;
  clearTimeout(saveTimers[run.cfg.name]);
  saveTimers[run.cfg.name] = setTimeout(async () => {
    const csv = "Frame,Visibility,X,Y,Checked\n" +
      run.rows.map(r => `${r.frame},${r.vis},${r.x},${r.y},${r.status}`).join("\n");
    const fh = await getHandle(dir, `out/finetune/ball/${run.cfg.name}.labeled.csv`, { create: true });
    const w = await fh.createWritable();
    await w.write(csv); await w.close();
    run.dirty = false;
    $("saved").textContent = "saved ✓";
    setTimeout(() => { $("saved").textContent = ""; }, 1200);
  }, 1000);
}

function mark(r, run, status) {
  if (!r.status) run.checked++;
  r.status = status;
  autosave(run);
}

cv.addEventListener("click", e => {
  if (hi < 0) return;
  const { run, idx } = history[hi];
  const r = run.rows[idx];
  const rect = cv.getBoundingClientRect();
  r.x = Math.round((e.clientX - rect.left) * cv.width / rect.width);
  r.y = Math.round((e.clientY - rect.top) * cv.height / rect.height);
  r.vis = 1;
  mark(r, run, "edit");
  draw();
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || hi < 0) return;
  const { run, idx } = history[hi];
  const r = run.rows[idx];
  if (e.key === " " || e.key === "Enter") {
    if (!r.status) mark(r, run, "ok");
    next(); e.preventDefault();
  } else if (e.key === "x") {
    r.vis = 0; r.x = 0; r.y = 0;
    mark(r, run, "reject");
    next();
  } else if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") { if (hi > 0) { hi--; show(); } }
});

$("filter").onchange = rebuild;
window.addEventListener("beforeunload", e => {
  if (runs.some(r => r.dirty)) e.preventDefault();
});
</script>
</body>
</html>
